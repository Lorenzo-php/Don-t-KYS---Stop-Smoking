<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f8f7f2">
    <title>Don't KYS - Stop Smoking</title>
    <link rel="icon" href="app-icon.png" type="image/png+xml">
    <link rel="stylesheet" href="style.css">
  </head>
  <body data-theme="day">
    <div class="app-frame" id="appFrame">
      <header class="app-header" id="appHeader" hidden>
        <div class="brand-lockup" aria-label="Don't KYS - Stop Smoking">
          <img class="brand-mark" src="app-icon.png" alt="">
          <div>
            <p class="brand-kicker" id="brandKicker">Stop Smoking</p>
            <h1 class="brand-title">Don't KYS</h1>
          </div>
        </div>
        <button class="icon-button" type="button" data-action="quick-theme" aria-label="Toggle theme">
          <span class="icon-sun" aria-hidden="true"></span>
        </button>
      </header>

      <main id="screenRoot" class="screen-root" aria-live="polite"></main>

      <nav class="bottom-nav" id="bottomNav" aria-label="Primary navigation" hidden></nav>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <div class="modal-backdrop" id="rankModal" hidden>
      <section class="modal-card rank-celebration" role="dialog" aria-modal="true" aria-labelledby="rankModalTitle">
        <div id="rankModalIcon" class="rank-modal-icon" aria-hidden="true"></div>
        <p class="modal-eyebrow" id="rankModalEyebrow"></p>
        <h2 id="rankModalTitle"></h2>
        <p id="rankModalText"></p>
        <button class="primary-button" type="button" data-action="close-rank-modal">
          <span class="button-icon check-icon" aria-hidden="true"></span>
          <span id="rankModalButton"></span>
        </button>
      </section>
    </div>

    <script src="translations.js"></script>
    <script src="ranks.js"></script>
    <script src="benefits.js"></script>
    <script src="chat.js"></script>
    <script src="storage.js"></script>
    <script src="app.js"></script>
  </body>
</html>
